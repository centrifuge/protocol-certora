{
    "solc": "solc0.8.28",
    "solc_evm_version": "cancun",
    "optimistic_loop": true,
    "loop_iter": "3",
    "java_args": [
        "-Xmx40g"
    ],
    "rule_sanity": "basic",
    "smt_timeout": "7200",
    "prover_args": [
        "-depth 20 -splitParallel true -dontStopAtFirstSplitTimeout true -numOfParallelSplits 8"
    ],
    "max_concurrent_rules": 8,
    "packages": [
        "@chimera=lib/chimera/src",
        "@recon=lib/setup-helpers/src",
        "chimera=lib/chimera/src",
        "createx-forge=lib/createx-forge",
        "ds-test=lib/chimera/lib/forge-std/lib/ds-test/src",
        "enso-weiroll=lib/enso-weiroll/contracts",
        "forge-std=lib/forge-std/src",
        "halmos-cheatcodes=lib/halmos-cheatcodes/src",
        "safe-smart-account=lib/safe-utils/lib/safe-smart-account/contracts",
        "safe-utils=lib/safe-utils/src",
        "setup-helpers=lib/setup-helpers/src",
        "solidity-http=lib/safe-utils/lib/solidity-http/src",
        "solidity-stringutils=lib/safe-utils/lib/solidity-stringutils/src",
        "src=src",
        "test=test"
    ]
}
